name: LaFix validation
on: [push, pull_request]
jobs:
  marketplace:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lafix
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: lafix_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lafix -d lafix_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lafix:test-only@localhost:5432/lafix_test
      AUTH_SECRET: ci-only-placeholder-with-more-than-32-characters
      APP_ORIGIN: http://localhost:3000
      TEST_BASE_URL: http://localhost:3000
      BILLING_MODE: sandbox
      ALLOW_LOCAL_HTTP_AUTH: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: |
          npm run start -w apps/web > /tmp/lafix-server.log 2>&1 &
          trap 'cat /tmp/lafix-server.log' EXIT
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/api/health && break; sleep 1; done
          curl -fsS http://localhost:3000/api/health
          npm run test:integration
          npm run test:e2e
