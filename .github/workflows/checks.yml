name: LaFix validation
on: [push, pull_request]
jobs:
  marketplace:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lafix
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: lafix_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lafix -d lafix_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lafix:test-only@localhost:5432/lafix_test
      AUTH_SECRET: ci-only-placeholder-with-more-than-32-characters
      APP_ORIGIN: http://localhost:3000
      TEST_BASE_URL: http://localhost:3000
      DEPLOYMENT_STAGE: test
      MAIL_DELIVERY_MODE: outbox
      AUTH_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      MARKETPLACE_MODE: paid
      BILLING_MODE: sandbox
      ALLOW_LOCAL_HTTP_AUTH: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run build
      - run: node --test tests/deployment/*.test.mjs
      - run: |
          npm run start -w apps/web > /tmp/lafix-server.log 2>&1 &
          trap 'cat /tmp/lafix-server.log' EXIT
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/api/health && break; sleep 1; done
          curl -fsS http://localhost:3000/api/health
          npm test
          npm run test:integration
      - name: Rehearse isolated PostgreSQL backup and restore
        env:
          PGPASSWORD: test-only
          RESTORE_CHECK_DATABASE_URL: postgresql://lafix:test-only@localhost:5432/lafix_restore_check
        run: |
          node scripts/backup-rehearsal.mjs --prepare
          docker exec ${{ job.services.postgres.id }} pg_dump -U lafix -d lafix_test -Fc > /tmp/lafix-synthetic-backup.dump
          docker exec ${{ job.services.postgres.id }} createdb -U lafix lafix_restore_check
          docker exec -i ${{ job.services.postgres.id }} pg_restore -U lafix -d lafix_restore_check --exit-on-error < /tmp/lafix-synthetic-backup.dump
          node scripts/backup-rehearsal.mjs --verify
          node scripts/backup-rehearsal.mjs --cleanup
          rm /tmp/lafix-synthetic-backup.dump
      - name: Install browser for end-to-end tests
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
